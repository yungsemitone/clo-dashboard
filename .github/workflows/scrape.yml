name: Refresh CLO data

# NPORT-P filings are quarterly, filed on staggered dates across the five funds.
# A weekly run catches new filings within a week of posting without hammering EDGAR.
# Trigger manually any time via the "Run workflow" button (workflow_dispatch).
on:
  schedule:
    - cron: '0 11 * * 1'   # Mondays 11:00 UTC (~6-7am ET)
  workflow_dispatch:

# Required so the committed-DB push below can write back to the repo.
# NOTE: repo Settings → Actions → General → Workflow permissions must also be
# set to "Read and write permissions" for this token to be allowed to push.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Snapshot committed database as baseline
        run: cp data/clo_data.db /tmp/baseline.db || true

      - name: Re-scrape EDGAR with sanity check and retries
        # Guard against committing a broken/partial scrape (EDGAR hiccup, format
        # change). Requires >=90% of the previously committed counts with absolute
        # floors (600 deals / 2,300 holdings), all 4 filings per fund, and a
        # clean run_pipeline.py exit (any filing that fails to download fails the attempt) — see scripts/check_scrape.py.
        # Retries up to 2 more times; if still short, restores the committed DB
        # and fails the job so nothing is committed or deployed.
        run: |
          for attempt in 1 2 3; do
            echo "::group::Scrape attempt $attempt"
            rc=0; python run_pipeline.py || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ] && python scripts/check_scrape.py data/clo_data.db /tmp/baseline.db; then
              echo "Scrape passed on attempt $attempt"; exit 0
            fi
            echo "Attempt $attempt below thresholds"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          cp /tmp/baseline.db data/clo_data.db || true
          echo "::error::Scrape produced too little data after 3 attempts — refusing to commit."
          exit 1
        env:
          PYTHONPATH: .

      - name: Refresh loan-level holdings, industries and FRED macro (Portfolio Shifts page)
        # Incremental: replaces a fund's loans only when its scrape returned rows,
        # so a partial EDGAR failure keeps the previously committed data.
        continue-on-error: true
        run: |
          python run_loan_pipeline.py
          python -c "
          import sqlite3, sys
          n = sqlite3.connect('data/clo_data.db').execute('select count(*) from loan_holdings').fetchone()[0]
          print(f'loan_holdings={n}')
          if n < 8000: sys.exit('Loan scrape looks thin')
          "
        env:
          PYTHONPATH: .

      - name: Commit and push if the database changed
        id: commit
        run: |
          git config user.name "CLO Scraper Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/clo_data.db
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-refresh CLO data $(date -u +'%Y-%m-%d')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Fly doesn't deploy on git push, so ship the image ourselves. Deploy on
      # every run, not only when the data changed — the image carries the app code
      # too, so a code-only change would otherwise never reach the live app.
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --remote-only -a clo-dashboard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
